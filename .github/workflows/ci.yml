name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Get mathlib cache
        run: lake exe cache get
      - name: Build (all proofs, tests, CLI)
        run: lake build
      - name: Smoke-run CLI
        run: ./.lake/build/bin/sharpknapsack 1/10 15 3 1 4 1 5 9 2 6

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: python3 python/tests.py
      - name: Witness sampler validations
        run: python3 experiments/test_witness_sampler.py
      - name: Smoke-run CLI
        run: python3 python/sharp_knapsack.py 1/10 15 3 1 4 1 5 9 2 6
